name: Build & Release

# Wypchnięcie tagu vX.Y.Z = nowy release z podpisanym APK (aktualizator w aplikacji go znajdzie)
# Wydanie: git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wersja z tagu
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Stały klucz z sekretów — dzięki temu aktualizacje instalują się na poprzednią wersję
      - name: Przygotuj keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Testy i build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:testReleaseUnitTest :app:assembleRelease -PappVersionName="$VERSION" --no-daemon --stacktrace

      - name: Nazwij APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OpenDesktop-$VERSION.apk"

      - name: Publikuj release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b')
          gh release create "$GITHUB_REF_NAME" "OpenDesktop-$VERSION.apk" \
            --title "OpenDesktop $VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
