name: Build & Release

# Wypchnięcie tagu vX.Y.Z = nowy release z podpisanym APK (aktualizator w aplikacji go znajdzie)
# Wydanie: git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Wersja z tagu
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      # Stały klucz z sekretów — dzięki temu aktualizacje instalują się na poprzednią wersję.
      # Bez niego wydanie się nie buduje: APK podpisany kluczem debug przypiąłby go użytkownikom na stałe.
      - name: Przygotuj keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Brak sekretu SIGNING_KEYSTORE_BASE64 – wydanie przerwane"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Testy i build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:testReleaseUnitTest :app:assembleRelease -PappVersionName="$VERSION" --no-daemon --stacktrace

      - name: Nazwij APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OpenDesktop-$VERSION.apk"
          echo "APK_SHA256=$(sha256sum "OpenDesktop-$VERSION.apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publikuj release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Linię z sumą czyta aktualizator w aplikacji i sprawdza nią pobrany plik
          NOTES=$(printf '%s\n\nSHA-256: %s' "$(git log -1 --pretty=format:'%s%n%n%b')" "$APK_SHA256")
          gh release create "$GITHUB_REF_NAME" "OpenDesktop-$VERSION.apk" \
            --title "OpenDesktop $VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
